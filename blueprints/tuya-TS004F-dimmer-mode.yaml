blueprint:
  name: ZHA - Tuya TS004F 4-Button Switch (Dimmer Mode)
  description: >
    Automate your Tuya TS004F 4-Button Switch (manufacturer _TZ3000_xabckq1v
    and similar) using ZHA events, matched against this device's actual
    single-endpoint "dimmer mode" behavior: Button 1 = On, Button 4 = Off,
    Button 2 = Dim Up, Button 3 = Dim Down (with hold-to-dim and stop-on-release).
  domain: automation
  input:
    tuya_switch:
      name: Tuya TS004F 4-Button Switch
      description: Tuya TS004F 4-Button Switch to use
      selector:
        device:
          filter:
            - manufacturer: Tuya
          multiple: false
    button_1_click:
      name: Button 1 (top-left) - Turn On
      default: []
      selector:
        action: {}
    button_2_click:
      name: Button 2 (top-right) - Dim Up (short press)
      default: []
      selector:
        action: {}
    button_2_hold:
      name: Button 2 (top-right) - Dim Up (hold, repeats while held)
      default: []
      selector:
        action: {}
    button_2_release:
      name: Button 2 (top-right) - Released after hold
      default: []
      selector:
        action: {}
    button_3_click:
      name: Button 3 (bottom-left) - Dim Down (short press)
      default: []
      selector:
        action: {}
    button_3_hold:
      name: Button 3 (bottom-left) - Dim Down (hold, repeats while held)
      default: []
      selector:
        action: {}
    button_3_release:
      name: Button 3 (bottom-left) - Released after hold
      default: []
      selector:
        action: {}
    button_4_click:
      name: Button 4 (bottom-right) - Turn Off
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input 'tuya_switch'

action:
  - variables:
      cluster_id: '{{ trigger.event.data.cluster_id }}'
      command: '{{ trigger.event.data.command }}'
      params: '{{ trigger.event.data.params }}'
      args: '{{ trigger.event.data.args }}'
  - choose:
      # Button 1 - Turn On (cluster 6, on_off attribute = 1)
      - conditions:
          - '{{ cluster_id == 6 }}'
          - '{{ command == "attribute_updated" }}'
          - '{{ trigger.event.data.args.attribute_name == "on_off" }}'
          - '{{ trigger.event.data.args.value == 1 }}'
        sequence: !input 'button_1_click'

      # Button 4 - Turn Off (cluster 6, on_off attribute = 0)
      - conditions:
          - '{{ cluster_id == 6 }}'
          - '{{ command == "attribute_updated" }}'
          - '{{ trigger.event.data.args.attribute_name == "on_off" }}'
          - '{{ trigger.event.data.args.value == 0 }}'
        sequence: !input 'button_4_click'

      # Button 2 - Dim Up short press (cluster 8, step, step_mode 0)
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "step" }}'
          - '{{ params.step_mode == 0 }}'
        sequence: !input 'button_2_click'

      # Button 3 - Dim Down short press (cluster 8, step, step_mode 1)
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "step" }}'
          - '{{ params.step_mode == 1 }}'
        sequence: !input 'button_3_click'

      # Button 2 - Dim Up hold (cluster 8, move, move_mode 0)
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "move" }}'
          - '{{ params.move_mode == 0 }}'
        sequence: !input 'button_2_hold'

      # Button 3 - Dim Down hold (cluster 8, move, move_mode 1)
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "move" }}'
          - '{{ params.move_mode == 1 }}'
        sequence: !input 'button_3_hold'

      # Stop (cluster 8, stop) - fired on release after a hold.
      # NOTE: this event does not indicate which direction was held, so both
      # release actions run together. Keep them idempotent (e.g. "stop
      # dimming the light") rather than direction-specific.
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "stop" }}'
        sequence:
          - if: '{{ true }}'
            then: !input 'button_2_release'
          - if: '{{ true }}'
            then: !input 'button_3_release'