blueprint:
  name: ZHA - Tuya TS004F 4-Button Switch (Dimmer Mode)
  description: >
    Automate your Tuya TS004F 4-Button Switch (manufacturer _TZ3000_xabckq1v
    and similar) using ZHA events, matched against this device's actual
    single-endpoint "dimmer mode" behavior: Top-Left = On, Bottom-Left = Off,
    Top-Right = Dim Up, Bottom-Right = Dim Down (with hold-to-dim and
    stop-on-release).
  domain: automation
  input:
    tuya_switch:
      name: Tuya TS004F 4-Button Switch
      description: Tuya TS004F 4-Button Switch to use
      selector:
        device:
          filter:
            - manufacturer: _TZ3000_xabckq1v
          multiple: false
    button_1_click:
      name: Top-Left - Turn On
      default: []
      selector:
        action: {}
    button_2_click:
      name: Top-Right - Dim Up (short press)
      default: []
      selector:
        action: {}
    button_2_hold:
      name: Top-Right - Dim Up (hold, repeats while held)
      default: []
      selector:
        action: {}
    button_2_release:
      name: Top-Right - Released after hold
      default: []
      selector:
        action: {}
    button_3_click:
      name: Bottom-Right - Dim Down (short press)
      default: []
      selector:
        action: {}
    button_3_hold:
      name: Bottom-Right - Dim Down (hold, repeats while held)
      default: []
      selector:
        action: {}
    button_3_release:
      name: Bottom-Right - Released after hold
      default: []
      selector:
        action: {}
    button_4_click:
      name: Bottom-Left - Turn Off
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input 'tuya_switch'

action:
  - variables:
      cluster_id: '{{ trigger.event.data.cluster_id }}'
      command: '{{ trigger.event.data.command }}'
  - choose:
      # Top-Left - Turn On (cluster 6, on_off attribute = 1)
      - conditions:
          - '{{ cluster_id == 6 }}'
          - '{{ command == "attribute_updated" }}'
          - '{{ trigger.event.data.args.attribute_name == "on_off" }}'
          - '{{ trigger.event.data.args.value == 1 }}'
        sequence:
          - sequence: !input 'button_1_click'
          - delay:
              milliseconds: 300

      # Bottom-Left - Turn Off (cluster 6, on_off attribute = 0)
      - conditions:
          - '{{ cluster_id == 6 }}'
          - '{{ command == "attribute_updated" }}'
          - '{{ trigger.event.data.args.attribute_name == "on_off" }}'
          - '{{ trigger.event.data.args.value == 0 }}'
        sequence:
          - sequence: !input 'button_4_click'
          - delay:
              milliseconds: 300

      # Top-Right - Dim Up short press (cluster 8, step, step_mode 0)
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "step" }}'
          - '{{ trigger.event.data.params.step_mode == 0 }}'
        sequence:
          - sequence: !input 'button_2_click'
          - delay:
              milliseconds: 300

      # Bottom-Right - Dim Down short press (cluster 8, step, step_mode 1)
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "step" }}'
          - '{{ trigger.event.data.params.step_mode == 1 }}'
        sequence:
          - sequence: !input 'button_3_click'
          - delay:
              milliseconds: 300

      # Top-Right - Dim Up hold (cluster 8, move, move_mode 0)
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "move" }}'
          - '{{ trigger.event.data.params.move_mode == 0 }}'
        sequence: !input 'button_2_hold'

      # Bottom-Right - Dim Down hold (cluster 8, move, move_mode 1)
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "move" }}'
          - '{{ trigger.event.data.params.move_mode == 1 }}'
        sequence: !input 'button_3_hold'

      # Stop (cluster 8, stop) - fired on release after a hold.
      # NOTE: this event does not indicate which direction was held, so both
      # release actions run together. Keep them idempotent (e.g. "stop
      # dimming the light") rather than direction-specific.
      - conditions:
          - '{{ cluster_id == 8 }}'
          - '{{ command == "stop" }}'
        sequence:
          - if: '{{ true }}'
            then: !input 'button_2_release'
          - if: '{{ true }}'
            then: !input 'button_3_release'