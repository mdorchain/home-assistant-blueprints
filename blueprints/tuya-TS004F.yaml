blueprint:
  name: ZHA - Tuya TS004F 4-Button Switch
  description: Automate your Tuya 4-Button Switch using ZHA events.
  domain: automation
  homeassistant:
    min_version: 2023.9.0
  input:
    tuya_4button_switch:
      name: Tuya TS004F 4-Button Switch
      description: Tuya TS004F 4-Button Switch to use
      selector:
        device:
          integration: zha
          multiple: false
    debug:
      name: Debug notifications
      description: Show a persistent notification with the raw event data on every press
      default: false
      selector:
        boolean: {}
    button_1_click:
      name: Button 1 - Click
      default: []
      selector:
        action: {}
    button_2_click:
      name: Button 2 - Click
      default: []
      selector:
        action: {}
    button_2_long_press:
      name: Button 2 - Long Press (Dim-Up)
      default: []
      selector:
        action: {}
    button_3_click:
      name: Button 3 - Click
      default: []
      selector:
        action: {}
    button_4_click:
      name: Button 4 - Click
      default: []
      selector:
        action: {}
    button_4_long_press:
      name: Button 4 - Long Press (Dim-Down)
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input tuya_4button_switch

action:
  - variables:
      debug: !input debug
      command: "{{ trigger.event.data.command }}"
      step_val: "{{ trigger.event.data.params.step_mode | default(-1, true) | int(-1) }}"
      move_val: "{{ trigger.event.data.params.move_mode | default(-1, true) | int(-1) }}"
      attr_name: "{{ trigger.event.data.args.attribute_name | default('', true) }}"
      attr_on: >-
        {% set v = trigger.event.data.args.value | default('', true) | string | lower %}
        {{ 'true' if ('true' in v or v.strip() == '1') else 'false' if ('false' in v or v.strip() == '0') else '' }}

  - if:
      - condition: template
        value_template: "{{ debug }}"
    then:
      - service: persistent_notification.create
        data:
          title: "Tuya TS004F: {{ command }}"
          message: >-
            command: {{ command }},
            step_val: {{ step_val }},
            move_val: {{ move_val }},
            attr_name: {{ attr_name }},
            attr_on: {{ attr_on }}

  - choose:
      # Button 1 / Button 3 (on_off attribute reports)
      - conditions: "{{ command == 'attribute_updated' and attr_name == 'on_off' and attr_on == 'true' }}"
        sequence: !input button_1_click
      - conditions: "{{ command == 'attribute_updated' and attr_name == 'on_off' and attr_on == 'false' }}"
        sequence: !input button_3_click
      # Button 2 / Button 4 short press
      - conditions: "{{ command == 'step' and step_val == 0 }}"
        sequence: !input button_2_click
      - conditions: "{{ command == 'step' and step_val == 1 }}"
        sequence: !input button_4_click
      # Long press
      - conditions: "{{ command == 'move' and move_val == 0 }}"
        sequence: !input button_2_long_press
      - conditions: "{{ command == 'move' and move_val == 1 }}"
        sequence: !input button_4_long_press