blueprint:
  name: ZHA - Tuya TS004F 4-Button Switch
  description: Automate your Tuya 4-Button Switch using ZHA events.
  domain: automation
  homeassistant:
    min_version: 2023.9.0
  input:
    tuya_4button_switch:
      name: Tuya TS004F 4-Button Switch
      description: Tuya TS004F 4-Button Switch to use
      selector:
        device:
          integration: zha
          multiple: false
    debug:
      name: Debug notifications
      description: Show a persistent notification with the raw event data on every press
      default: false
      selector:
        boolean: {}
    button_1_click:
      name: Button 1 - Click
      default: []
      selector:
        action: {}
    button_2_click:
      name: Button 2 - Click
      default: []
      selector:
        action: {}
    button_2_long_press:
      name: Button 2 - Long Press (Dim-Up)
      default: []
      selector:
        action: {}
    button_3_click:
      name: Button 3 - Click
      default: []
      selector:
        action: {}
    button_4_click:
      name: Button 4 - Click
      default: []
      selector:
        action: {}
    button_4_long_press:
      name: Button 4 - Long Press (Dim-Down)
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input tuya_4button_switch

action:
  - variables:
      debug: !input debug
      command: "{{ trigger.event.data.command }}"
      args: "{{ trigger.event.data.args }}"
      params: "{{ trigger.event.data.params }}"
      step_raw: >-
        {% if params is mapping and params.get('step_mode') is not none -%}
          {{ params.get('step_mode') }}
        {%- elif args is mapping and args.get('step_mode') is not none -%}
          {{ args.get('step_mode') }}
        {%- elif args is not mapping and args is not string and args | length > 0 -%}
          {{ args[0] }}
        {%- endif %}
      move_raw: >-
        {% if params is mapping and params.get('move_mode') is not none -%}
          {{ params.get('move_mode') }}
        {%- elif args is mapping and args.get('move_mode') is not none -%}
          {{ args.get('move_mode') }}
        {%- elif args is not mapping and args is not string and args | length > 0 -%}
          {{ args[0] }}
        {%- endif %}
      step_dir: >-
        {% set s = step_raw | string %}
        {{ 'up' if ('Up' in s or s.strip() == '0') else 'down' if ('Down' in s or s.strip() == '1') else '' }}
      move_dir: >-
        {% set s = move_raw | string %}
        {{ 'up' if ('Up' in s or s.strip() == '0') else 'down' if ('Down' in s or s.strip() == '1') else '' }}

  - if:
      - condition: template
        value_template: "{{ debug }}"
    then:
      - service: persistent_notification.create
        data:
          title: "Tuya TS004F: {{ command }}"
          message: >-
            command: {{ command }},
            step_dir: {{ step_dir }},
            move_dir: {{ move_dir }},
            args: {{ args }},
            params: {{ params }}

  - choose:
      - conditions: "{{ command == 'on' }}"
        sequence: !input button_1_click
      - conditions: "{{ command == 'off' }}"
        sequence: !input button_3_click
      - conditions: "{{ command == 'step' }}"
        sequence:
          - choose:
              - conditions: "{{ step_dir == 'up' }}"
                sequence: !input button_2_click
              - conditions: "{{ step_dir == 'down' }}"
                sequence: !input button_4_click
      - conditions: "{{ command == 'move' }}"
        sequence:
          - choose:
              - conditions: "{{ move_dir == 'up' }}"
                sequence: !input button_2_long_press
              - conditions: "{{ move_dir == 'down' }}"
                sequence: !input button_4_long_press