blueprint:
  name: ZHA - Tuya TS004F 4-Button Switch
  description: Automate your Tuya 4-Button Switch using ZHA events.
  domain: automation
  homeassistant:
    min_version: 2023.9.0
  input:
    tuya_4button_switch:
      name: Tuya TS004F 4-Button Switch
      description: Tuya TS004F 4-Button Switch to use
      selector:
        device:
          integration: zha
          multiple: false
    debug:
      name: Debug notifications
      description: Show a persistent notification with the raw event data on every press
      default: false
      selector:
        boolean: {}
    button_1_click:
      name: Button 1 - Click
      default: []
      selector:
        action: {}
    button_2_click:
      name: Button 2 - Click
      default: []
      selector:
        action: {}
    button_2_long_press:
      name: Button 2 - Long Press (Dim-Up)
      default: []
      selector:
        action: {}
    button_3_click:
      name: Button 3 - Click
      default: []
      selector:
        action: {}
    button_4_click:
      name: Button 4 - Click
      default: []
      selector:
        action: {}
    button_4_long_press:
      name: Button 4 - Long Press (Dim-Down)
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input tuya_4button_switch

action:
  - variables:
      debug: !input debug
      command: "{{ trigger.event.data.command }}"
      step_s: "{{ trigger.event.data.params.step_mode | default('') | string }}"
      move_s: "{{ trigger.event.data.params.move_mode | default('') | string }}"
      attr_name: "{{ trigger.event.data.args.attribute_name | default('') }}"
      attr_s: "{{ trigger.event.data.args.value | default('') | string | lower }}"
      step_dir: >-
        {{ 'up' if ('Up' in step_s or step_s | trim == '0')
           else 'down' if ('Down' in step_s or step_s | trim == '1')
           else '' }}
      move_dir: >-
        {{ 'up' if ('Up' in move_s or move_s | trim == '0')
           else 'down' if ('Down' in move_s or move_s | trim == '1')
           else '' }}
      attr_on: >-
        {{ 'true' if ('true' in attr_s or attr_s | trim == '1')
           else 'false' if ('false' in attr_s or attr_s | trim == '0')
           else '' }}

  - if:
      - condition: template
        value_template: "{{ debug }}"
    then:
      - service: persistent_notification.create
        data:
          title: "Tuya TS004F: {{ command }}"
          message: >-
            command: {{ command }},
            step_dir: {{ step_dir }},
            move_dir: {{ move_dir }},
            attr_name: {{ attr_name }},
            attr_on: {{ attr_on }}

  - choose:
      # Button 1 / Button 3 (on_off attribute reports)
      - conditions: "{{ command == 'attribute_updated' and attr_name == 'on_off' and attr_on == 'true' }}"
        sequence: !input button_1_click
      - conditions: "{{ command == 'attribute_updated' and attr_name == 'on_off' and attr_on == 'false' }}"
        sequence: !input button_3_click
      # Button 2 / Button 4 short press
      - conditions: "{{ command == 'step' and step_dir == 'up' }}"
        sequence: !input button_2_click
      - conditions: "{{ command == 'step' and step_dir == 'down' }}"
        sequence: !input button_4_click
      # Long press
      - conditions: "{{ command == 'move' and move_dir == 'up' }}"
        sequence: !input button_2_long_press
      - conditions: "{{ command == 'move' and move_dir == 'down' }}"
        sequence: !input button_4_long_press