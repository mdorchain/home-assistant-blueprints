blueprint:
  name: ZHA - Tuya TS004F 4-Button Switch
  description: Automate your Tuya 4-Button Switch using ZHA events.
  domain: automation
  homeassistant:
    min_version: 2023.9.0
  input:
    tuya_4button_switch:
      name: Tuya TS004F 4-Button Switch
      description: Tuya TS004F 4-Button Switch to use
      selector:
        device:
          filter:
            - manufacturer: Tuya
              model: TS004F
            - manufacturer: _TZ3000_xabckq1v
              model: TS004F
          multiple: false
    debug:
      name: Debug notifications
      description: Show a persistent notification with the raw event data on every press
      default: false
      selector:
        boolean: {}
    button_1_click:
      name: Button 1 - Click
      description: Action to run on upper-left single press
      default: []
      selector:
        action: {}
    button_2_click:
      name: Button 2 - Click
      description: Action to run on upper-right single press
      default: []
      selector:
        action: {}
    button_2_long_press:
      name: Button 2 - Long Press (Dim-Up)
      description: Action to run on upper-right long press
      default: []
      selector:
        action: {}
    button_3_click:
      name: Button 3 - Click
      description: Action to run on lower-left single press
      default: []
      selector:
        action: {}
    button_4_click:
      name: Button 4 - Click
      description: Action to run on lower-right single press
      default: []
      selector:
        action: {}
    button_4_long_press:
      name: Button 4 - Long Press (Dim-Down)
      description: Action to run on lower-right long press
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input tuya_4button_switch

variables:
  debug: !input debug

action:
  - variables:
      command: "{{ trigger.event.data.command }}"
      params: "{{ trigger.event.data.params | default({}, true) }}"
      step_mode: "{{ params.step_mode | default('') | string }}"
      move_mode: "{{ params.move_mode | default('') | string }}"

  - if:
      - condition: template
        value_template: "{{ debug }}"
    then:
      - service: persistent_notification.create
        data:
          title: "Tuya TS004F: {{ command }}"
          message: >-
            command: {{ command }},
            step_mode: {{ step_mode }},
            move_mode: {{ move_mode }},
            raw: {{ trigger.event.data }}

  - choose:
      - conditions: "{{ command == 'on' }}"
        sequence: !input button_1_click
      - conditions: "{{ command == 'off' }}"
        sequence: !input button_3_click
      - conditions: "{{ command == 'step' }}"
        sequence:
          - choose:
              - conditions: "{{ step_mode in ['StepMode.Up', '0'] }}"
                sequence: !input button_2_click
              - conditions: "{{ step_mode in ['StepMode.Down', '1'] }}"
                sequence: !input button_4_click
      - conditions: "{{ command == 'move' }}"
        sequence:
          - choose:
              - conditions: "{{ move_mode in ['MoveMode.Up', '0'] }}"
                sequence: !input button_2_long_press
              - conditions: "{{ move_mode in ['MoveMode.Down', '1'] }}"
                sequence: !input button_4_long_press